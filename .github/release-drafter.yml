name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

template: |
  # What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: 'No changes since last release.'

categories:
  - title: 'Breaking'
    label: 'type: breaking'
  - title: 'New'
    label: 'type: feature'
  - title: 'Bug Fixes'
    label: 'type: bug'
  - title: 'Security'
    label: 'type: security'
  - title: 'Maintenance'
    label: 'type: maintenance'
  - title: 'Documentation'
    label: 'type: docs'
  - title: 'Dependency Updates'
    label: 'type: dependencies'
    collapse-after: 5
  - title: 'Other changes'

version-resolver:
  major:
    labels:
      - 'type: breaking'
  minor:
    labels:
      - 'type: feature'
  patch:
    labels:
      - 'type: bug'
      - 'type: maintenance'
      - 'type: docs'
      - 'type: dependencies'
      - 'type: security'
  default: patch

autolabeler:
  - label: 'type: docs'
    files:
      - '*.md'
      - 'docs/**/*'
  - label: 'type: dependencies'
    files:
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**/*'
  - label: 'type: maintenance'
    files:
      - '.github/**/*'
  - label: 'type: breaking'
    title:
      - '/!:/'
  - label: 'type: feature'
    title:
      - '/^feat(\(.+\))?:/'
  - label: 'type: bug'
    title:
      - '/^fix(\(.+\))?:/'

exclude-labels:
  - 'skip-changelog'